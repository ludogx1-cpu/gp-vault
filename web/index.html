  <script>
    function findFlutterElement(id) {
      let el = document.getElementById(id);
      if (el) return el;
      const fv = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (fv && fv.shadowRoot) {
        const pvs = fv.shadowRoot.querySelectorAll('flt-platform-view');
        for (let i = 0; i < pvs.length; i++) {
          if (pvs[i].shadowRoot) {
            el = pvs[i].shadowRoot.getElementById(id);
            if (el) return el;
          }
        }
      }
      return null;
    }
  </script>
    <script>
      function waitForElement(id, callback) {
        let attempts = 0;
        const interval = setInterval(() => {
          const el = findFlutterElement(id);
          if (el) { clearInterval(interval); callback(el); }
          if (++attempts > 60) clearInterval(interval);
        }, 100);
      }
 
    function renderHCaptcha() {
      waitForElement('hcaptcha-target', (el) => {
        el.innerHTML = '';
        hcaptcha.render(el, {
          'sitekey': 'e47877ca-d0f0-44d0-aa70-7e06f3a2848e',
          'callback': function(t) {
              console.log('hCaptcha callback token received');
              
              // 400ms delay to stop Flutter DevTools crash
              setTimeout(function() {
                window.postMessage(JSON.stringify({ type: 'captcha', token: t }), '*');
              }, 400);
            }
        });
      });
    }
 
    function renderTurnstile() {
      waitForElement('turnstile-target', (el) => {
        el.innerHTML = '';
        if (typeof turnstile !== 'undefined') {
          turnstile.render(el, {
            'sitekey': '0x4AAAAAADN3brAhvXC8xH0X',
            'callback': function(t) {
                console.log('Turnstile callback token received');
                
                // 400ms delay applied here as well
                setTimeout(function() {
                  window.postMessage(JSON.stringify({ type: 'captcha', token: t }), '*');
                }, 400);
              }
          });
        } else {
          setTimeout(renderTurnstile, 1000);
        }
      });
    }
  </script>

      'aads-banner': "<iframe data-aa='2437203' src='//ad.a-ads.com/2437203?size=728x90' style='width:728px; height:90px; border:0px; padding:0; overflow:hidden; background-color: transparent;'></iframe>"
    };

    function showAadsOverlay(id, x, y) {
      var el = document.getElementById(id);
      if (!el) return;

      // Only inject the iframe when it's actually being positioned on screen
      if (el.innerHTML.trim() === '') {
        var template = document.getElementById('template-' + id);
        if (template) {
          el.innerHTML = template.innerHTML;
        }
      }

      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }
    function hideAadsOverlay(id) {
      var el = document.getElementById(id);
      if (el) {
        el.innerHTML = ''; // Remove the iframe to stop background refreshes
        el.style.left = '-9999px';
        el.style.top = '-9999px';
      }
    }
    function hideAllAads() {
      var els = document.querySelectorAll('.aads-overlay');
      for (var i = 0; i < els.length; i++) { 
        els[i].innerHTML = ''; // Remove the iframe
        els[i].style.left = '-9999px';
        els[i].style.top = '-9999px';
      }
    }
  </script>
