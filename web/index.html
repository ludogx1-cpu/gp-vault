    .aads-overlay {

  <script>

  if (window.location.pathname === '/thankyou.html') {

  }
  
</script>

  <script>
    function findFlutterElement(id) {
      let el = document.getElementById(id);
      if (el) return el;
      const fv = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (fv && fv.shadowRoot) {
        const pvs = fv.shadowRoot.querySelectorAll('flt-platform-view');
        for (let i = 0; i < pvs.length; i++) {
          if (pvs[i].shadowRoot) {
            el = pvs[i].shadowRoot.getElementById(id);
            if (el) return el;
          }
        }
      }
      return null;
    }
  </script>
    <script>
      function waitForElement(id, callback) {
        let attempts = 0;
        const interval = setInterval(() => {
          const el = findFlutterElement(id);
          if (el) { clearInterval(interval); callback(el); }
          if (++attempts > 60) clearInterval(interval);
        }, 100);
      }
 
    function renderHCaptcha() {
      waitForElement('hcaptcha-target', (el) => {
        el.innerHTML = '';
        hcaptcha.render(el, {
          'sitekey': 'e47877ca-d0f0-44d0-aa70-7e06f3a2848e',
          'callback': function(t) {
              console.log('hCaptcha callback token received');
              
              // 400ms delay to stop Flutter DevTools crash
              setTimeout(function() {
                window.postMessage(JSON.stringify({ type: 'captcha', token: t }), '*');
              }, 400);
            }
        });
      });
    }
 
    function renderTurnstile() {
      waitForElement('turnstile-target', (el) => {
        el.innerHTML = '';
        if (typeof turnstile !== 'undefined') {
          turnstile.render(el, {
            'sitekey': '0x4AAAAAADN3brAhvXC8xH0X',
            'callback': function(t) {
                console.log('Turnstile callback token received');
                
                // 400ms delay applied here as well
                setTimeout(function() {
                  window.postMessage(JSON.stringify({ type: 'captcha', token: t }), '*');
                }, 400);
              }
          });
        } else {
          setTimeout(renderTurnstile, 1000);
        }
      });
    }
  </script>
  <script>
    // --- A-Ads Overlay Management ---
    function showAadsOverlay(id, x, y) {
      var el = document.getElementById(id);
      if (!el) return;
      
      // Inject iframe if missing
      if (el.innerHTML.trim() === '') {
        var size = '300x250';
        var adId = '';
        if (id === 'aads-left') { adId = '2437206'; }
        else if (id === 'aads-right') { adId = '2437207'; }
        else if (id === 'aads-banner') { adId = '2437203'; size = '728x90'; }
        
        el.innerHTML = "<iframe data-aa='" + adId + "' src='https://ad.a-ads.com/" + adId + "/?size=" + size + "' referrerpolicy='no-referrer-when-downgrade' allowtransparency='true' style='border: 0; width: 100%; height: 100%;'></iframe>";
      }
      
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }
    function hideAadsOverlay(id) {
      var el = document.getElementById(id);
      if (el) {
        el.style.left = '-9999px';
        el.style.top = '-9999px';
        el.innerHTML = '';
      }
    }
    function hideAllAads() {
      var els = document.querySelectorAll('.aads-overlay');
      for (var i = 0; i < els.length; i++) { 
        els[i].style.left = '-9999px';
        els[i].style.top = '-9999px';
        els[i].innerHTML = '';
      }
    }
  </script>
</head>
<body>
  <div id="gp-captcha-token"></div>

  <!-- A-Ads Overlay Containers (outside Flutter Shadow DOM) -->
  <div id="aads-left" class="aads-overlay"></div>
  <div id="aads-right" class="aads-overlay"></div>
  <div id="aads-banner" class="aads-overlay"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
