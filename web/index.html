  <script>
    function findFlutterElement(id) {
      let el = document.getElementById(id);
      if (el) return el;
      const fv = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (fv && fv.shadowRoot) {
        const pvs = fv.shadowRoot.querySelectorAll('flt-platform-view');
        for (let i = 0; i < pvs.length; i++) {
          if (pvs[i].shadowRoot) {
            el = pvs[i].shadowRoot.getElementById(id);
            if (el) return el;
          }
        }
      }
      return null;
    }
  </script>
    <script>
      function waitForElement(id, callback) {
        let attempts = 0;
        const interval = setInterval(() => {
          const el = findFlutterElement(id);
          if (el) { clearInterval(interval); callback(el); }
          if (++attempts > 60) clearInterval(interval);
        }, 100);
      }
 
    function renderHCaptcha() {
      waitForElement('hcaptcha-target', (el) => {
        el.innerHTML = '';
        hcaptcha.render(el, {
          'sitekey': 'e47877ca-d0f0-44d0-aa70-7e06f3a2848e',
          'callback': function(t) {
              console.log('hCaptcha callback token received');
              setTimeout(function() {
                window.postMessage(JSON.stringify({ type: 'captcha', token: t }), '*');
              }, 400);
            }
        });
      });
    }
 
    function renderTurnstile() {
      waitForElement('turnstile-target', (el) => {
        el.innerHTML = '';
        if (typeof turnstile !== 'undefined') {
          turnstile.render(el, {
            'sitekey': '0x4AAAAAADN3brAhvXC8xH0X',
            'callback': function(t) {
                console.log('Turnstile callback token received');
                setTimeout(function() {
                  window.postMessage(JSON.stringify({ type: 'captcha', token: t }), '*');
                }, 400);
              }
          });
        } else {
          setTimeout(renderTurnstile, 1000);
        }
      });
    }
  </script>
  <script>
    // --- User Interaction Tracking for Bot Evasion ---
    let userInteracted = false;
    function markInteracted() { 
      if (userInteracted) return;
      userInteracted = true; 
      
      // Hide the crawler container overlay
      var container = document.getElementById('aads-crawler-container');
      if (container) {
        container.style.display = 'none';
        container.style.pointerEvents = 'none';
        
        // Move the ads to the body so they can be positioned by Flutter
        document.body.appendChild(document.getElementById('aads-left'));
        document.body.appendChild(document.getElementById('aads-right'));
        document.body.appendChild(document.getElementById('aads-banner'));
      }
    }
    
    window.addEventListener('mousemove', markInteracted, {once: true});
    window.addEventListener('touchstart', markInteracted, {once: true});
    window.addEventListener('keydown', markInteracted, {once: true});
    window.addEventListener('wheel', markInteracted, {once: true});
    window.addEventListener('pointermove', markInteracted, {once: true});

    // --- A-Ads Overlay Management ---
    const aadsConfig = {
      'aads-left': "<iframe data-aa='2437206' src='//ad.a-ads.com/2437206?size=300x250' style='width:300px; height:250px; border:0px; padding:0; overflow:hidden; background-color: transparent;'></iframe>",
      'aads-right': "<iframe data-aa='2437207' src='//ad.a-ads.com/2437207?size=300x250' style='width:300px; height:250px; border:0px; padding:0; overflow:hidden; background-color: transparent;'></iframe>",
      'aads-banner': "<iframe data-aa='2437203' src='//ad.a-ads.com/2437203?size=728x90' style='width:728px; height:90px; border:0px; padding:0; overflow:hidden; background-color: transparent;'></iframe>"
    };

    function showAadsOverlay(id, x, y) {
      var el = document.getElementById(id);
      if (!el) return;

      if (el.innerHTML.trim() === '') {
        el.innerHTML = aadsConfig[id];
      }

      if (!userInteracted) {
        // Bot is viewing. Let them flow naturally in the crawler container.
        el.className = 'aads-crawler-mode';
      } else {
        // Real user interacted. Position normally.
        el.className = 'aads-overlay';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      }
    }
    
    function hideAadsOverlay(id) {
      var el = document.getElementById(id);
      if (el) {
        el.className = 'aads-crawler-mode';
      }
    }
    
    function hideAllAads() {
      var els = document.querySelectorAll('.aads-overlay, .aads-crawler-mode');
      for (var i = 0; i < els.length; i++) { 
        if (els[i].id && els[i].id.startsWith('aads-')) {
          els[i].className = 'aads-crawler-mode';
        }
      }
    }
  </script>
