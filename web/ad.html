<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad</title>
  <link rel="stylesheet" href="ad_styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2047805482197197" crossorigin="anonymous"></script>
</head>
<body>
  <ins class="adsbygoogle ad-container"
       data-ad-client="ca-pub-2047805482197197"
       id="ad-slot-ins"></ins>
  <script>
       const urlParams = new URLSearchParams(window.location.search);
       const slot = urlParams.get('slot') || '6054324338';
       document.getElementById('ad-slot-ins').setAttribute('data-ad-slot', slot);
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</body>
</html>
