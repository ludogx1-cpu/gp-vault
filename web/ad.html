<html>

</head>
<body>

       data-ad-client="ca-pub-2047805482197197"
       id="ad-slot-ins"></ins>

       const urlParams = new URLSearchParams(window.location.search);
       const slot = urlParams.get('slot') || '6054324338';

       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
