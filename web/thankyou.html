<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Purchase - Golden Paw</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .checkmark {
            color: #28a745;
            font-size: 80px;
            line-height: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #e2b13c; /* Golden Paw theme color */
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #cd9f32;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="checkmark">✓</div>
        <h1>Thank You for Your Purchase!</h1>
        <p>Your ad placement request has been received. We are processing your campaign, and your ads will go live shortly.</p>
        <a href="https://goldenpaw.dog" class="btn">Return to Home</a>
    </div>

</body>
</html>
