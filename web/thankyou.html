<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Purchase - Golden Paw</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .checkmark {
            color: #28a745;
            font-size: 80px;
            line-height: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #e2b13c; /* Golden Paw theme color */
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #cd9f32;
        }
    </style>
  <script type="text/javascript">
      adroll_adv_id = "TYRCWKOL3VFWDDX7CA3SRB";
      adroll_pix_id = "DRHLQQ37O5FJNP4COTDDK2";
      adroll_version = "2.0";

      (function(w, d, e, o, a) {
          w.adroll_tag_source = w.adroll_tag_source || "manual";
          w.__adroll_loaded = true;
          w.adroll = w.adroll || [];
          w.adroll.f = [ 'setProperties', 'identify', 'track', 'identify_email', 'get_cookie' ];
          var roundtripUrl = "https://s.adroll.com/j/" + adroll_adv_id
                  + "/roundtrip.js";
          for (a = 0; a < w.adroll.f.length; a++) {
              w.adroll[w.adroll.f[a]] = w.adroll[w.adroll.f[a]] || (function(n) {
                  return function() {
                      w.adroll.push([ n, arguments ])
                  }
              })(w.adroll.f[a])
          }

          e = d.createElement('script');
          o = d.getElementsByTagName('script')[0];
          e.async = 1;
          e.src = roundtripUrl;
          o.parentNode.insertBefore(e, o);
      })(window, document);
      adroll.track("pageView");
      
      // Parse URL parameters in case you pass dynamic data to the thankyou page
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId') || "";
      const userId = urlParams.get('userId') || "";
      const amount = urlParams.get('amount') || "0.00";

      adroll.track("purchase", {
        "ORDER_ID": orderId,
        "USER_ID": userId,
        "conversion_value": amount,
        "currency": "USD"
      });
  </script>
</head>
<body>

    <div class="card">
        <div class="checkmark">✓</div>
        <h1>Thank You for Your Purchase!</h1>
        <p>Your ad placement request has been received. We are processing your campaign, and your ads will go live shortly.</p>
        <a href="https://goldenpaw.dog" class="btn">Return to Home</a>
    </div>

</body>
</html>
