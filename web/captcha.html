<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Golden Paw Verification</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
    }
    #captcha-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 70px;
    }
  </style>
</head>
<body>
  <div id="captcha-container"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const provider = (urlParams.get('type') || urlParams.get('provider') || 'turnstile').toLowerCase();
    const isDark = urlParams.get('dark') === 'true';

    function notifyFlutter(token) {
      const payload = JSON.stringify({
        token: token,
        captcha_token: token,
        turnstile_token: token,
        provider: provider
      });
      if (window.Print && typeof window.Print.postMessage === 'function') {
        window.Print.postMessage(payload);
      }
      if (window.parent) {
        window.parent.postMessage(payload, '*');
      }
    }

    if (provider === 'turnstile') {
      // ONLY load Turnstile - zero cookies, zero consent popups!
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      script.async = true;
      script.defer = true;
      script.onload = function() {
        if (typeof turnstile !== 'undefined') {
          turnstile.ready(function() {
            try {
              turnstile.render('#captcha-container', {
                sitekey: '0x4AAAAAADN3brAhvXC8xH0X',
                theme: isDark ? 'dark' : 'light',
                callback: function(token) {
                  notifyFlutter(token);
                },
                'error-callback': function(code) {
                  console.warn('Turnstile error:', code);
                }
              });
            } catch(e) {
              console.error('Turnstile render error:', e);
            }
          });
        }
      };
      document.head.appendChild(script);
    } else {
      // hCaptcha fallback
      const script = document.createElement('script');
      script.src = 'https://js.hcaptcha.com/1/api.js?render=explicit';
      script.async = true;
      script.defer = true;
      script.onload = function() {
        if (typeof hcaptcha !== 'undefined') {
          const container = document.getElementById('captcha-container');
          try {
            hcaptcha.render('captcha-container', {
              sitekey: 'e47877ca-d0f0-44d0-aa70-7e06f3a2848e',
              theme: isDark ? 'dark' : 'light',
              callback: function(token) {
                notifyFlutter(token);
              }
            });
          } catch(e) {
            console.error('hCaptcha render error:', e);
          }
        }
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
