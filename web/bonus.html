<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph tags for Facebook / Social Media Preview -->
    <meta property="og:title" content="Golden Paw - Recommended Partners">
    <meta property="og:description" content="Discover our latest recommended partners and offers.">
    <meta property="og:image" content="https://goldenpaw.dog/favicon.png">

    <meta property="og:type" content="website">

    <!-- Twitter Card data -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Golden Paw - Recommended Partners">
    <meta name="twitter:description" content="Discover our latest recommended partners and offers.">
    <meta name="twitter:image" content="https://goldenpaw.dog/favicon.png">

    <title>Golden Paw - Redirecting...</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ffb703;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            margin: 10px 0;
            color: #ffb703;
        }

        p {
            color: #a0a0b0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Redirecting...</h2>
    <p>Please wait while we redirect you...</p>

    <script>
        // Automatic redirect to the Adsterra SmartLink after 1.5 seconds
        // This slight delay allows the loading screen to show briefly and feels more natural
        setTimeout(function() {
            window.location.replace("https://landslidegraphsystems.com/nfh55pexs1?key=9a0ed7097ed4eea865b35f48b6a69f47");
        }, 1500);
    </script>
</body>
</html>
