<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Paw - Bonus Sponsors</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; color: #3e2723; }
    .header { background-color: #ffb300; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 20px; text-align: center; }
    .welcome-text { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 30px; line-height: 1.5; }
    .ad-zone { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; margin: 20px; }
    .sponsor-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-bottom: 25px; }
    .sponsor-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-decoration: none; color: inherit; transition: transform 0.2s ease; display: flex; flex-direction: column; }
    .sponsor-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
    .sponsor-card img { width: 100%; height: 180px; object-fit: cover; background-color: #eee; }
    .card-title { padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #121212; color: #ffffff; }
      .header { background-color: #ffb300; color: #121212; }
      .sponsor-card { background: #1e1e1e; color: white; }
      .welcome-text { color: #eeeeee; }
      .ref-square { background-color: #2c2c2c; color: #ffffff; }
    }
    .ref-square {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 250px;
      border-radius: 15px;
      text-decoration: none;
      color: #e0e0e0;
      background-color: #2c2c2c;
      border: 3px solid;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .ref-square:hover { transform: scale(1.05); }
    .ref-square-sub { font-size: 14px; font-weight: normal; margin-top: 10px; opacity: 0.9; text-align: center; padding: 0 10px; line-height: 1.2; }
    
    .bitco-728x90 { width: 728px; height: 90px; overflow: hidden; }
    .bitco-300x250 { width: 300px; height: 250px; overflow: hidden; }
    .bitco-160x600 { width: 160px; height: 600px; overflow: hidden; }
    .bitco-468x60 { width: 468px; height: 60px; overflow: hidden; }
    .bitco-300x100 { width: 300px; height: 100px; overflow: hidden; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="https://landslidegraphsystems.com/95/df/01/95df01543f4314cfaeaa9181f0b6ba8f.js"></script>
</head>
<body>

  <div class="header">
    <h1>BONUS SPONSORS</h1>
  </div>

  <div class="container">
    <p class="welcome-text">Please click on an ad below and stay on the page for 20 seconds to earn your reward. Thank you for supporting the Golden Paw ecosystem!</p>




    <!-- Bitcotasks 728x90 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=728x90" frameborder="no" class="bitco-728x90"></iframe>
    </div>

    <!-- Adsterra 468x60 Ad -->
    <div class="ad-zone" onmouseenter="mouseOverAd = true" onmouseleave="mouseOverAd = false">
      <script>
        if (typeof atAsyncOptions !== 'object') var atAsyncOptions = [];
        atAsyncOptions.push({
          key: '81487b0cf69981d5b93588025428264e',
          format: 'js',
          async: true,
          container: 'atContainer-81487b0cf69981d5b93588025428264e',
          params: {}
        });
        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.async = true;
        script.src = 'https://landslidegraphsystems.com/81487b0cf69981d5b93588025428264e/invoke.js';
        document.getElementsByTagName('head')[0].appendChild(script);
      </script>
      <div id="atContainer-81487b0cf69981d5b93588025428264e"></div>
    </div>


    <!-- Bitcotasks 300x250 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=300x250" frameborder="no" class="bitco-300x250"></iframe>
    </div>

    <!-- New Adsterra Ad -->
    <div class="ad-zone" onmouseenter="mouseOverAd = true" onmouseleave="mouseOverAd = false">
      <script async="async" data-cfasync="false" src="https://landslidegraphsystems.com/5a1631fd346668d84ae6824804be13b4/invoke.js"></script>
      <div id="container-5a1631fd346668d84ae6824804be13b4"></div>
    </div>


    <!-- Bitcotasks 160x600 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=160x600" frameborder="no" class="bitco-160x600"></iframe>
    </div>

    <!-- 🚀 9 AD ZONES -->
    <div id="top-1" class="ad-zone"></div>
    <div id="top-2" class="ad-zone"></div>
    <div id="top-3" class="ad-zone"></div>
    
    <div id="middle-1" class="ad-zone"></div>
    <div id="middle-2" class="ad-zone"></div>
    


    <!-- Bitcotasks 468x60 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=468x60" frameborder="no" class="bitco-468x60"></iframe>
    </div>

    <!-- Bitcotasks 300x100 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=300x100" frameborder="no" class="bitco-300x100"></iframe>
    </div>

    <!-- Extra Bitcotasks 300x250 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=300x250" frameborder="no" class="bitco-300x250"></iframe>
    </div>

    <!-- Extra Bitcotasks 728x90 Ad -->
    <div class="ad-zone">
      <iframe src="https://bitcotasks.com/banner.php?key=0cd9422cecc4ffac20af8a7d&size=728x90" frameborder="no" class="bitco-728x90"></iframe>
    </div>

    <!-- Sponsor Cards Grid -->
    <div id="sponsors-container" class="sponsor-grid"></div>

    <div id="middle-3" class="ad-zone"></div>
    
    <div id="bottom-1" class="ad-zone"></div>
    <div id="bottom-2" class="ad-zone"></div>
    <div id="bottom-3" class="ad-zone"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: ["AIzaSyCDpj38A", "VvMY01EGKFtJo1", "YzNC8oUE6VZo"].join(''),
      authDomain: "golden-paw-database.firebaseapp.com",
      projectId: "golden-paw-database",
      storageBucket: "golden-paw-database.firebasestorage.app",
      messagingSenderId: "163858364889",
      appId: "1:163858364889:web:12db63a67659cd094a01c8"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const zones = {
      'Top 1': document.getElementById('top-1'),
      'Top 2': document.getElementById('top-2'),
      'Top 3': document.getElementById('top-3'),
      'Middle 1': document.getElementById('middle-1'),
      'Middle 2': document.getElementById('middle-2'),
      'Middle 3': document.getElementById('middle-3'),
      'Bottom 1': document.getElementById('bottom-1'),
      'Bottom 2': document.getElementById('bottom-2'),
      'Bottom 3': document.getElementById('bottom-3')
    };

    function notifyParentTimer() {
      try {
        if (window.opener) {
          window.opener.postMessage(JSON.stringify({ type: 'start_bonus_timer' }), '*');
        }
      } catch (e) {
        console.warn("postMessage failed:", e);
      }
      
      try {
        localStorage.setItem('flutter.bonus_timer_trigger', Date.now().toString());
      } catch (e) {
        console.warn("localStorage failed:", e);
      }
    }

    // Simply trigger the timer whenever the window loses focus (e.g., opening a new tab).
    // This perfectly captures clicks on all dynamic/iframe ads like Monetag without relying on mouse events.
    window.addEventListener('blur', () => {
      notifyParentTimer();
    });

    // Fetch Ad Placeholders
    db.collection("sponsor_placeholders").onSnapshot((querySnapshot) => {
      Object.values(zones).forEach(z => z.innerHTML = ''); 
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.iframe_code && zones[data.position]) {
          const adWrapper = document.createElement('div');
          adWrapper.innerHTML = data.iframe_code;
          
          adWrapper.addEventListener('mouseenter', () => mouseOverAd = true);
          adWrapper.addEventListener('mouseleave', () => mouseOverAd = false);
          
          zones[data.position].appendChild(adWrapper);
        }
      });
    });

    // Fetch Sponsor Cards
    const cardContainer = document.getElementById('sponsors-container');
    db.collection("bonus_sponsors").orderBy("created_at", "desc").onSnapshot((querySnapshot) => {
      cardContainer.innerHTML = '';

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const card = document.createElement('a');
        card.className = 'sponsor-card';
        card.href = data.target_url || '#';
        card.target = '_blank';
        let imageHtml = data.image_url ? `<img src="${data.image_url}" alt="Banner">` : '';
        card.innerHTML = `${imageHtml}<div class="card-title">${data.title || 'Sponsored Link'}</div>`;
        card.addEventListener('click', notifyParentTimer);
        cardContainer.appendChild(card);
      });
    });
  </script>

  <!-- Adsterra Social Bar -->
  <script type="text/javascript" src="https://landslidegraphsystems.com/4c/45/e5/4c45e528bc3d4938c2c8ca2f36cfdbce.js"></script>

</body>
</html>
