<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1400px;height:560px;overflow:hidden;position:relative;box-sizing:border-box;
 background:radial-gradient(circle at 24% 55%,#4a3412 0,#251b0c 38%,#17130c 70%);font-family:"Segoe UI",system-ui,sans-serif;color:#f6efe2}
.glow{position:absolute;left:40px;top:90px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(224,165,38,.35),rgba(224,165,38,0) 70%)}
.dog{position:absolute;left:70px;top:105px;width:340px;height:340px;object-fit:contain}
.copy{position:absolute;left:440px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.brand img{width:56px;height:56px}
.brand span{font-size:30px;font-weight:700;color:#e0a526;letter-spacing:.02em}
h1{font-size:46px;line-height:1.08;margin:0 0 18px}
h1 em{font-style:normal;color:#e0a526}
p{font-size:21px;line-height:1.4;margin:0;color:#d8c8a6}
.popup{position:absolute;right:70px;top:40px;height:480px;border-radius:16px;clip-path:inset(4px 6px 4px 4px round 14px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
</style></head><body>
<div class="glow"></div>
<img class="dog" src="../pets/shiba_adult.png" alt="">
<div class="copy">
 <div class="brand"><img src="../icons/icon128.png" alt=""><span>Golden Paw</span></div>
 <h1>Care for your Shiba.<br><em>Claim DOGE</em> every 5&nbsp;minutes.</h1>
 <p>Your pet and the faucet, one click away in your Chrome toolbar.</p>
</div>
<img class="popup" src="popup-capture.png" alt="">
</body></html>
