<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Golden Paw</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>Golden Paw</h1>
    <button id="signout" class="link hidden" type="button">Sign out</button>
  </header>

  <!-- Signed out -->
  <section id="login-view" class="hidden">
    <form id="login-form" class="card">
      <h2>Sign in</h2>
      <button id="google-btn" class="google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Sign in with Google
      </button>
      <div class="or"><span>or use your email</span></div>
      <label>Email <input id="email" type="email" autocomplete="email" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="login-btn" class="primary" type="submit">Sign in</button>
      <p id="login-msg" class="msg" role="status"></p>
      <p class="muted small"><button id="forgot" class="link" type="button">Forgot password?</button>
        Enter your email above and we'll email you a link to set one.</p>
      <p class="muted small">No account yet? <a id="site-link" href="#">Sign up at goldenpaw.dog</a>.</p>
    </form>
  </section>

  <!-- Signed in -->
  <section id="main-view" class="hidden">
    <div class="card pet">
      <img id="pet-img" src="pets/shiba_puppy.png" alt="Your Shiba" width="96" height="96">
      <div class="pet-info">
        <div class="pet-title"><strong id="pet-name">Your Shiba</strong> <span id="pet-stage" class="chip">puppy</span></div>
        <div class="stat"><span>Hunger</span><meter id="hunger" min="0" max="100" low="30" high="70" optimum="100"></meter></div>
        <div class="stat"><span>Happy</span><meter id="happiness" min="0" max="100" low="30" high="70" optimum="100"></meter></div>
        <div class="stat"><span>Energy</span><meter id="energy" min="0" max="100" low="30" high="70" optimum="100"></meter></div>
      </div>
    </div>
    <div class="actions">
      <button data-action="feed" type="button" title="Costs 0.005 DOGE (free if your balance is lower)">🍖 Feed</button>
      <button data-action="play" type="button" title="Costs 0.005 DOGE (free if your balance is lower)">🎾 Play</button>
      <button data-action="boop" type="button">🐾 Boop</button>
    </div>
    <p id="pet-msg" class="msg" role="status"></p>

    <div class="card faucet">
      <h2>5-minute faucet</h2>
      <div class="mode" role="radiogroup" aria-label="Where to send your claim">
        <label><input type="radio" name="mode" value="vault" checked> Save to Vault</label>
        <label><input type="radio" name="mode" value="faucetpay"> Send to FaucetPay</label>
      </div>
      <label id="address-row" class="hidden">FaucetPay address or email
        <input id="address" type="text" autocomplete="off" spellcheck="false">
      </label>
      <p id="verify-row" class="warn hidden">Sending to FaucetPay needs a verified email.
        <button id="resend" class="link" type="button">Resend link</button> ·
        <button id="recheck" class="link" type="button">I've verified</button></p>

      <div id="timer" class="timer hidden">Next claim in <strong id="countdown">5:00</strong></div>
      <div id="captcha-box" class="captcha hidden">
        <select id="captcha-provider" aria-label="Captcha">
          <option value="turnstile">Cloudflare Turnstile</option>
          <option value="hcaptcha">hCaptcha</option>
        </select>
        <iframe id="captcha" title="Verification"></iframe>
      </div>
      <button id="claim" class="primary" type="button" disabled>Solve the captcha</button>
      <p id="faucet-msg" class="msg" role="status"></p>
    </div>

    <footer><a id="open-site" href="#">Open the full app ↗</a></footer>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
