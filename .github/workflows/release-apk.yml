name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Google Services (Firebase)
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > android/app/google-services.json
          fi
          test -f android/app/google-services.json || { echo "Error: android/app/google-services.json is missing"; exit 1; }

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Setting up keystore from secret..."
            # Tolerate line breaks, Windows line endings, spaces and certutil
            # "-----BEGIN/END CERTIFICATE-----" lines around the Base64 text.
            if ! printf '%s' "$KEYSTORE_BASE64" | sed '/^-----/d' | tr -d '[:space:]' | base64 -d > android/app/release.keystore 2>/dev/null; then
              echo "::error title=KEYSTORE_BASE64 is not valid::The KEYSTORE_BASE64 secret is not a Base64-encoded keystore. Re-create it from the .keystore/.jks file (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"FULL\\PATH\\release.keystore\")) | Set-Clipboard) and paste only that output into the secret."
              exit 1
            fi
          fi
          if [ -f "android/app/release.keystore" ]; then
            missing=""
            [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
            [ -n "$STORE_PASSWORD" ] || missing="$missing STORE_PASSWORD"
            if [ -n "$missing" ]; then
              echo "::error title=Missing signing secrets::A release keystore is present but these repository secrets are not set:$missing. Add them under Settings > Secrets and variables > Actions, or remove KEYSTORE_BASE64 to build with debug signing."
              exit 1
            fi
            # Check the password opens the keystore before spending minutes on the build.
            if ! keytool -list -keystore android/app/release.keystore -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error title=Keystore and password do not match::STORE_PASSWORD does not open the keystore in KEYSTORE_BASE64, or it has no '$KEY_ALIAS' entry. If you changed the keystore password, update KEYSTORE_BASE64 with the re-saved keystore file as well as the password secrets."
              exit 1
            fi
            echo "Keystore opened. Signing certificate SHA-256 (not secret):"
            keytool -list -v -keystore android/app/release.keystore -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | grep -m1 'SHA256:'
            echo "Configuring release signing with android/app/release.keystore..."
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "Warning: android/app/release.keystore not found; falling back to debug signing."
          fi

      - name: Build Android Release APKs
        run: |
          mkdir -p dist
          # 1. Build split-per-abi APKs (under 30MB for IzzyOnDroid)
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/GoldenPaw-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/GoldenPaw-armeabi-v7a.apk

          # 2. Build universal fat APK (contains all ABIs)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/GoldenPaw-universal.apk

      - name: Verify release APKs
        run: |
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPaw-apks
          path: dist/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Golden Paw ${{ github.ref_name }}
          body: |
            ## Golden Paw Release ${{ github.ref_name }}
            
            - `GoldenPaw-arm64-v8a.apk` (Recommended for modern phones, under 30MB)
            - `GoldenPaw-universal.apk` (All architectures combined)
            - Compatible with Android 5.0+ (API 21+).
            - F-Droid / IzzyOnDroid compatible release artifacts.
          draft: false
          prerelease: false
