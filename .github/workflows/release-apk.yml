name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Google Services (Firebase)
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > android/app/google-services.json
          fi
          test -f android/app/google-services.json || { echo "Error: android/app/google-services.json is missing"; exit 1; }

      - name: Setup Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'goldenpaw2026' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'goldenpaw2026' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Setting up keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "No KEYSTORE_BASE64 secret provided; using debug signing configuration."
          fi

      - name: Build Android Release APKs
        run: |
          mkdir -p dist
          # 1. Build split-per-abi APKs (under 30MB for IzzyOnDroid)
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/GoldenPaw-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/GoldenPaw-armeabi-v7a.apk

          # 2. Build universal fat APK (contains all ABIs)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/GoldenPaw-universal.apk

      - name: Verify release APKs
        run: |
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPaw-apks
          path: dist/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Golden Paw ${{ github.ref_name }}
          body: |
            ## Golden Paw Release ${{ github.ref_name }}
            
            - `GoldenPaw-arm64-v8a.apk` (Recommended for modern phones, under 30MB)
            - `GoldenPaw-universal.apk` (All architectures combined)
            - Compatible with Android 5.0+ (API 21+).
            - F-Droid / IzzyOnDroid compatible release artifacts.
          draft: false
          prerelease: false
