name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Keystore (if secrets provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'goldenpaw2026' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'goldenpaw2026' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build Android Release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare APKs for release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/GoldenPaw-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/GoldenPaw-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/GoldenPaw-universal.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPaw-apks
          path: dist/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Golden Paw ${{ github.ref_name }}
          body: |
            ## Golden Paw Release ${{ github.ref_name }}
            
            - `GoldenPaw-arm64-v8a.apk` (Recommended for modern phones, under 30MB)
            - `GoldenPaw-universal.apk` (All architectures combined)
            - Compatible with Android 5.0+ (API 21+).
            - F-Droid / IzzyOnDroid compatible release artifacts.
          draft: false
          prerelease: false
