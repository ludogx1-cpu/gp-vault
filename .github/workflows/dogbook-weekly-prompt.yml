name: Book Of Dog weekly prompt

# Every Monday morning Zen posts a new photo challenge in The Book Of Dog, and the
# run summary shows how last week's challenge went (posts, owners, returning owners).
# Prompts and the card design: tools/dogbook/weekly_prompt.mjs. Safe to run by hand:
# it never posts twice in the same week.
on:
  schedule:
    - cron: '7 9 * * 1'   # Mondays 09:07 UTC (09:07 UK in winter, 10:07 in summer)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogbook-weekly-prompt
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post this week's prompt
        working-directory: tools/dogbook
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GOLDEN_PAW_DATABASE }}
        run: |
          npm ci --no-audit --no-fund
          node weekly_prompt.mjs
