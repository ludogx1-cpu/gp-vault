name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror Repository to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is not set in GitHub repository settings!"
            echo "Please add GITLAB_TOKEN in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Configure mirror remote with authentication
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/ludogx1-cpu/golden-paw-doge-hub.git"
          
          # Ensure all remote branches are tracked locally
          for branch in $(git branch -r | grep -v '\->' | sed 's/origin\///'); do
            git branch --track "$branch" "origin/$branch" 2>/dev/null || true
          done

          echo "Pushing all branches to GitLab..."
          git push gitlab --all --force

          echo "Pushing all tags to GitLab..."
          git push gitlab --tags --force
