name: gp_faucet
description: "Golden Paw - Dogecoin faucet, staking, and pet ecosystem."
publish_to: 'none' 
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  # --- UPDATED FIREBASE BRAINS ---
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_database: ^12.4.6
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.5
  pointer_interceptor: ^0.10.1+2
  web: ^1.1.1

  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  go_router: ^17.3.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  flutter_markdown: ^0.7.7+1
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^17.1.2
  local_notifier: ^0.1.6
  timezone: ^0.9.2
  webview_flutter: ^4.14.1
  firebase_messaging: ^16.4.3
  firebase_messaging_web: ^4.2.3
  firebase_performance: ^0.11.4+5
  firebase_analytics: ^12.4.5
  showcaseview: ^5.1.0
  intl: ^0.20.3
  firebase_data_connect: ^0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Goldenpawicon.png"
  web:
    generate: true
    image_path: "assets/Goldenpawicon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter:
  uses-material-design: true

