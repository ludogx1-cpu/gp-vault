# Fetch the current authenticated user's data — auth.uid must match the requested id
query GetUserById($id: String!) @auth(expr: "auth.uid == vars.id") {
  user(id: $id) {
    id
    dogeBalance
    stakedBalance
    bankBalance
    role
    petHunger
    petHappiness
    petEnergy
    petTotalDistanceWalked
    lastClaimTime
  }
}

# Global chat feed — intentionally server-side only, served via backend Admin SDK to avoid uid-row-level lint
query GetRecentChatMessages($limit: Int = 50) @auth(level: NO_ACCESS) {
  chatMessages(orderBy: { timestamp: DESC }, limit: $limit) {
    id
    text
    timestamp
    user {
      id
      role
    }
  }
}

# Global app updates — intentionally server-side only, served via /get-updates backend endpoint
query GetAppUpdates @auth(level: NO_ACCESS) {
  appUpdates(orderBy: { timestamp: DESC }) {
    id
    title
    content
    timestamp
  }
}