mutation CreateUserAccount($displayName: String!, $email: String!, $bio: String!) @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", displayName: $displayName, email: $email, bio: $bio})
}

mutation UpdateMyUser($displayName: String, $bio: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {displayName: $displayName, bio: $bio})
}

mutation DeleteMyUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetMyUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    displayName
    email
    bio
  }
}

query ListAllUsers @auth(level: PUBLIC, insecureReason: "Publicly accessible directory of users for networking.") {
  users {
    displayName
    bio
  }
}

mutation CreateSkill($name: String!, $category: String!) @auth(level: USER) {
  skill_insert(data: {name: $name, category: $category})
}

mutation UpdateSkill($id: UUID!, $category: String!) @auth(level: USER) {
  skill_update(id: $id, data: {category: $category})
}

mutation DeleteSkill($id: UUID!) @auth(level: USER) {
  skill_delete(id: $id)
}

query GetSkill($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public skill definition.") {
  skill(id: $id) {
    name
    category
  }
}

query ListSkills @auth(level: PUBLIC, insecureReason: "Public skill list.") {
  skills {
    name
  }
}

mutation AddUserSkill($skillId: UUID!, $level: String!) @auth(level: USER) {
  userSkill_insert(data: {userId_expr: "auth.uid", skillId: $skillId, level: $level})
}

mutation UpdateUserSkill($id: UUID!, $level: String!) @auth(level: USER) {
  userSkill_update(id: $id, data: {level: $level})
}

mutation RemoveUserSkill($id: UUID!) @auth(level: USER) {
  userSkill_delete(id: $id)
}

query GetUserSkill($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public skill profile.") {
  userSkill(id: $id) {
    user { displayName }
    skill { name }
    level
  }
}

query ListMySkills @auth(level: USER) {
  userSkills(where: {userId: {eq_expr: "auth.uid"}}) {
    skill { name }
    level
  }
}

mutation ProposeSession($recipientId: UUID!, $scheduledDate: Timestamp!) @auth(level: USER) {
  session_insert(data: {proposerId_expr: "auth.uid", recipientId: $recipientId, status: "pending", scheduledDate: $scheduledDate})
}

mutation UpdateSessionStatus($id: UUID!, $status: String!) @auth(level: USER) {
  session_update(id: $id, data: {status: $status})
}

mutation DeleteSession($id: UUID!) @auth(level: USER) {
  session_delete(id: $id)
}

query GetSession($id: UUID!) @auth(level: USER) {
  session(id: $id) {
    status
    scheduledDate
    proposer { displayName }
  }
}

query ListMySessions @auth(level: USER) {
  sessions(where: {_or: [{proposerId: {eq_expr: "auth.uid"}}, {recipientId: {eq_expr: "auth.uid"}}]}) {
    status
    scheduledDate
  }
}

mutation SubmitReview($sessionId: UUID!, $rating: Int!, $comment: String!) @auth(level: USER) {
  review_insert(data: {sessionId: $sessionId, reviewerId_expr: "auth.uid", rating: $rating, comment: $comment})
}

mutation UpdateReview($id: UUID!, $rating: Int!, $comment: String!) @auth(level: USER) {
  review_update(id: $id, data: {rating: $rating, comment: $comment})
}

mutation DeleteReview($id: UUID!) @auth(level: USER) {
  review_delete(id: $id)
}

query GetReview($id: UUID!) @auth(level: PUBLIC, insecureReason: "Reviews are public testimonials.") {
  review(id: $id) {
    rating
    comment
    reviewer { displayName }
  }
}

query ListReviewsForSession($sessionId: UUID!) @auth(level: PUBLIC, insecureReason: "Public review list.") {
  reviews(where: {sessionId: {eq: $sessionId}}) {
    rating
    comment
  }
}