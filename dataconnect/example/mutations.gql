# Create a new user upon signup — only the authenticated user can create their own row
mutation CreateUser($id: String!) @auth(expr: "auth.uid == vars.id") {
  user_insert(data: {
    id: $id
  })
}

# Update a user's balances — only the authenticated user can update their own row
mutation UpdateUserBalances(
  $id: String!, 
  $dogeBalance: Float, 
  $stakedBalance: Float,
  $bankBalance: Float,
  $offerwallBalance: Float,
  $adsBalance: Float,
  $xp: Int,
  $totalClaims: Int,
  $faucetClaims: Int,
  $lastClaimTime: Timestamp
) @auth(expr: "auth.uid == vars.id") {
  user_update(id: $id, data: {
    dogeBalance: $dogeBalance,
    stakedBalance: $stakedBalance,
    bankBalance: $bankBalance,
    offerwallBalance: $offerwallBalance,
    adsBalance: $adsBalance,
    xp: $xp,
    totalClaims: $totalClaims,
    faucetClaims: $faucetClaims,
    lastClaimTime: $lastClaimTime
  })
}

# Update pet stats — only the authenticated user can update their own pet
mutation UpdatePetStats(
  $id: String!,
  $petHunger: Float,
  $petHappiness: Float,
  $petEnergy: Float
) @auth(expr: "auth.uid == vars.id") {
  user_update(id: $id, data: {
    petHunger: $petHunger,
    petHappiness: $petHappiness,
    petEnergy: $petEnergy
  })
}

# Send a chat message — only the authenticated user can insert as themselves
mutation SendChatMessage($userId: String!, $text: String!) @auth(expr: "auth.uid == vars.userId") {
  chatMessage_insert(data: {
    userId: $userId,
    text: $text
  })
}

# Migrate a user with all their data — only the authenticated user can upsert their own row
mutation MigrateUser(
  $id: String!,
  $dogeBalance: Float,
  $stakedBalance: Float,
  $bankBalance: Float,
  $offerwallBalance: Float,
  $adsBalance: Float,
  $xp: Int,
  $role: String,
  $totalClaims: Int,
  $faucetClaims: Int,
  $lastClaimTime: Timestamp,
  $stakeTimestamp: Timestamp,
  $petBirthDate: Timestamp,
  $petHunger: Float,
  $petHappiness: Float,
  $petEnergy: Float,
  $petLastInteraction: Timestamp,
  $petTotalDistanceWalked: Float
) @auth(expr: "auth.uid == vars.id") {
  user_upsert(data: {
    id: $id,
    dogeBalance: $dogeBalance,
    stakedBalance: $stakedBalance,
    bankBalance: $bankBalance,
    offerwallBalance: $offerwallBalance,
    adsBalance: $adsBalance,
    xp: $xp,
    role: $role,
    totalClaims: $totalClaims,
    faucetClaims: $faucetClaims,
    lastClaimTime: $lastClaimTime,
    stakeTimestamp: $stakeTimestamp,
    petBirthDate: $petBirthDate,
    petHunger: $petHunger,
    petHappiness: $petHappiness,
    petEnergy: $petEnergy,
    petLastInteraction: $petLastInteraction,
    petTotalDistanceWalked: $petTotalDistanceWalked
  })
}
