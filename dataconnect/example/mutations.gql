# Create a new user upon signup
mutation CreateUser($id: String!) @auth(level: PUBLIC) {
  user_insert(data: {
    id: $id
  })
}

# Update a user's balances (used by the Faucet/Vault backend)
mutation UpdateUserBalances(
  $id: String!, 
  $dogeBalance: Float, 
  $stakedBalance: Float,
  $bankBalance: Float,
  $xp: Int,
  $totalClaims: Int,
  $faucetClaims: Int,
  $lastClaimTime: Timestamp
) @auth(level: PUBLIC) {
  user_update(id: $id, data: {
    dogeBalance: $dogeBalance,
    stakedBalance: $stakedBalance,
    bankBalance: $bankBalance,
    xp: $xp,
    totalClaims: $totalClaims,
    faucetClaims: $faucetClaims,
    lastClaimTime: $lastClaimTime
  })
}

# Update pet stats (used by the Node-cron backend task)
mutation UpdatePetStats(
  $id: String!,
  $petHunger: Float,
  $petHappiness: Float,
  $petEnergy: Float
) @auth(level: PUBLIC) {
  user_update(id: $id, data: {
    petHunger: $petHunger,
    petHappiness: $petHappiness,
    petEnergy: $petEnergy
  })
}

# Send a chat message
mutation SendChatMessage($userId: String!, $text: String!) @auth(level: PUBLIC) {
  chatMessage_insert(data: {
    userId: $userId,
    text: $text
  })
}

# Migrate a user with all their data
mutation MigrateUser(
  $id: String!,
  $dogeBalance: Float,
  $stakedBalance: Float,
  $bankBalance: Float,
  $offerwallBalance: Float,
  $adsBalance: Float,
  $xp: Int,
  $role: String,
  $totalClaims: Int,
  $faucetClaims: Int,
  $lastClaimTime: Timestamp,
  $stakeTimestamp: Timestamp,
  $petBirthDate: Timestamp,
  $petHunger: Float,
  $petHappiness: Float,
  $petEnergy: Float,
  $petLastInteraction: Timestamp,
  $petTotalDistanceWalked: Float
) @auth(level: PUBLIC) {
  user_upsert(data: {
    id: $id,
    dogeBalance: $dogeBalance,
    stakedBalance: $stakedBalance,
    bankBalance: $bankBalance,
    offerwallBalance: $offerwallBalance,
    adsBalance: $adsBalance,
    xp: $xp,
    role: $role,
    totalClaims: $totalClaims,
    faucetClaims: $faucetClaims,
    lastClaimTime: $lastClaimTime,
    stakeTimestamp: $stakeTimestamp,
    petBirthDate: $petBirthDate,
    petHunger: $petHunger,
    petHappiness: $petHappiness,
    petEnergy: $petEnergy,
    petLastInteraction: $petLastInteraction,
    petTotalDistanceWalked: $petTotalDistanceWalked
  })
}
